# パスを可視化するかの設定用
is_visible: true

# 制御周波数 [Hz]
hz: 10

# frame_id
robot_frame: "base_link"

# 速度制限
max_vel1: 0.5            # [m/s]（平常時）
max_vel2: 0.3             # [m/s]（減速時）
avoid_thres_vel: 0.3     # [m/s]（回避中か判断する閾値）
min_vel: 0.0              # [m/s]
max_yawrate1: 1.5         # [rad/s]（平常時）
max_yawrate2: 1.0        # [rad/s]（減速時）
turn_thres_yawrate: 1.0  # [rad/s]（旋回中か判断する閾値）
mode_log_time: 10

# 加速度制限
max_accel: 1.0    # [m/s^2]
max_dyawrate: 2.0 # [rad/s^2]

# 速度解像度
vel_reso: 0.03    # [m/s]
yawrate_reso: 0.03 # [rad/s]

# 停止状態か判断する閾値
stop_vel_th: 0.01
stop_yawrate_th: 0.05

# 時間 [s]
dt: 0.1
predict_time1: 2.0
predict_time2: 3.0

# 機体サイズ(半径) [m]
roomba_radius: 0.17
radius_margin1: 0.05  #（平常時）
radius_margin2: 0.1 #（減速時）

# 重み定数 [-]
weight_heading1: 2.0 #（平常時）
weight_heading2: 1.0  #（減速時）
weight_dist1: 0.3     #（平常時）
weight_dist2: 0.1     #（減速時）
weight_vel: 0.1

# 許容誤差 [m]
goal_tolerance: 0.2

# 評価関数distで探索する範囲 [m]
search_range: 3.0