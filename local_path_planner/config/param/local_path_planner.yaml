local_path_planner:
  ros__parameters:
    # パスを可視化するかの設定用
    is_visible: true

    # 制御周波数 [Hz]
    hz: 10

    # frame_id
    robot_frame: "base_link"

    # 速度制限 [m/s], [rad/s]
    max_vel1: 0.8            # 平常時の最高速
    max_vel2: 0.5            # ゴール付近での減速時
    max_vel_y1: 0.3          # メカナム特有：横移動の最高速（コードに追加した変数用）
    max_vel_y2: 0.1          # メカナム特有：減速時の横移動
    min_vel: 0.0             # 後退を許可しないなら0.0
    max_yawrate1: 1.0        # 平常時の最大旋回速度
    max_yawrate2: 0.5        # 減速時の最大旋回速度

    # モード切り替えの閾値（必要に応じてコードで活用）
    avoid_thres_vel: 0.1     # 回避中とみなす速度閾値
    turn_thres_yawrate: 0.2  # 旋回中とみなす旋回速度閾値
    mode_log_time: 1.0       # ログを記録する時間間隔

    # 加速度制限
    max_accel: 1.5           # モータの性能に合わせて1.0〜2.5の間で調整
    max_dyawrate: 2.0        # 旋回加速度

    # 速度解像度（探索の細かさ）
    vel_reso: 0.05           # 0.05m/s刻みで探索
    yawrate_reso: 0.1        # 0.1rad/s刻みで探索

    # 停止状態か判断する閾値
    stop_vel_th: 0.02
    stop_yawrate_th: 0.02

    # 時間 [s]
    dt: 0.1                  # 1/hz と合わせる
    predict_time1: 1.5       # 平常時：2秒先まで予測
    predict_time2: 1.2       # 減速時：少し短めに予測

    # 機体サイズ(半径) [m]
    roomba_radius: 0.4       # 機体の中心から角までの距離
    radius_margin1: 0.15     # 安全マージン（平常時）
    radius_margin2: 0.02     # 安全マージン（接近時）

    # 重み定数 [-] (合計1.0にする必要はないが、バランスが重要)
    weight_heading1: 0.3     # ゴールへ向かう力の強さ
    weight_heading2: 0.8     # (減速時)
    weight_dist1: 0.8        # 障害物を避ける力の強さ
    weight_dist2: 0.4        # (減速時)
    weight_vel: 0.2          # 最高速を維持しようとする力

    # 許容誤差 [m]
    goal_tolerance: 0.2

    # 評価関数distで探索する範囲 [m]
    search_range: 3.0